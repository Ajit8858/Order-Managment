services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: omb_user
      POSTGRES_PASSWORD: omb_pass
      POSTGRES_DB: order_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omb_user -d order_management"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery_worker:
    build: .
    env_file: .env
    depends_on:
      - api
      - redis
      - postgres
    volumes:
      - .:/app
    command: celery -A app.celery_app worker --loglevel=info

  celery_beat:
    build: .
    env_file: .env
    depends_on:
      - api
      - redis
      - postgres
    volumes:
      - .:/app
    command: celery -A app.celery_app beat --loglevel=info

  flower:
    build: .
    env_file: .env
    depends_on:
      - redis
    ports:
      - "5555:5555"
    command: celery -A app.celery_app flower --port=5555

volumes:
  pgdata:
